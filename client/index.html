<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日历 - 清单日历</title>
  </head>
  <body class="sidebar webkit zh_CN">
    <div id="loading-view" class="loading-view" style="display: none">
      <div class="logo"><i class="loading-logo"></i></div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (e) {
        var d = document.createElement('div');
        d.id = 'boot-error';
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#e13e39;color:#fff;padding:8px 12px;font-size:12px;white-space:pre-wrap;';
        d.textContent = 'BOOT ERROR: ' + (e.message || e.error) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '');
        document.body.appendChild(d);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var d = document.createElement('div');
        d.id = 'boot-error-2';
        d.style.cssText = 'position:fixed;top:60px;left:0;right:0;z-index:9999;background:#faa80c;color:#fff;padding:8px 12px;font-size:12px;white-space:pre-wrap;';
        d.textContent = 'PROMISE ERROR: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason);
        document.body.appendChild(d);
      });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
