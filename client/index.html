<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>流光 — 日历与清单</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%236a8dff'/%3E%3Cstop%20offset='1'%20stop-color='%23a26bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='url(%23g)'/%3E%3Cpath%20d='M20%2033l8%208%2016-17'%20stroke='white'%20stroke-width='6'%20fill='none'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body class="sidebar webkit zh_CN">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (e) {
        var d = document.createElement('div');
        d.id = 'boot-error';
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#e13e39;color:#fff;padding:8px 12px;font-size:12px;white-space:pre-wrap;';
        d.textContent = 'BOOT ERROR: ' + (e.message || e.error) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '');
        document.body.appendChild(d);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var d = document.createElement('div');
        d.id = 'boot-error-2';
        d.style.cssText = 'position:fixed;top:60px;left:0;right:0;z-index:9999;background:#faa80c;color:#fff;padding:8px 12px;font-size:12px;white-space:pre-wrap;';
        d.textContent = 'PROMISE ERROR: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason);
        document.body.appendChild(d);
      });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
